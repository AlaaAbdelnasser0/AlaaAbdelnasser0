  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a9b3c9"><text x="26" y="112">Full LMS with courses, quizzes, exams, certificates,</text><text x="26" y="134">wallets &amp; instructor payouts, coupons, bundles and a</text><text x="26" y="156">built-in AI assistant.</text></g>
