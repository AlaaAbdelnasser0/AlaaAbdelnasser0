<svg xmlns="http://www.w3.org/2000/svg" width="440" height="265" viewBox="0 0 440 265">
<style>
  .fl { animation: fl 4.2s ease-in-out infinite; animation-delay: -1.10s; }
  @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .sh { animation: sh 4.2s ease-in-out infinite; animation-delay: -1.10s; transform-box: fill-box; transform-origin: center; }
  @keyframes sh { 0%,100% { transform: scaleX(1); opacity: .45; } 50% { transform: scaleX(.86); opacity: .2; } }
  .if { animation: if 3.2s ease-in-out infinite; animation-delay: -1.43s; }
  @keyframes if { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .fp { animation: fp 9s cubic-bezier(.45,0,.2,1) infinite; animation-delay: 1.40s; transform-box: fill-box; transform-origin: center; }
  @keyframes fp { 0%,78% { transform: scaleX(1) skewY(0); } 83% { transform: scaleX(.02) skewY(-12deg); } 88% { transform: scaleX(-1) skewY(0); }
                   93% { transform: scaleX(.02) skewY(12deg); } 98%,100% { transform: scaleX(1) skewY(0); } }
  .g { animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .6; } }
  .sw { animation: sw 7s ease-in-out infinite; animation-delay: 1.80s; }
  @keyframes sw { 0%,70% { transform: translateX(-260px); } 100% { transform: translateX(700px); } }
</style>
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131a2a"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="ed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#260670"/><stop offset=".5" stop-color="#3c09b0"/><stop offset="1" stop-color="#210560"/></linearGradient>
  <clipPath id="c"><rect x=".5" y=".5" width="439" height="229" rx="16"/></clipPath>
  <filter id="bl" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<ellipse class="sh" filter="url(#bl)" cx="220.0" cy="256" rx="190.0" ry="7" fill="#8B5CF6" opacity=".4"/>
<g class="fl"><g transform="translate(0 10)">
  <rect x="0" y="9" width="440" height="230" rx="16" fill="url(#ed)"/>
  <rect x="0" y="4.5" width="440" height="230" rx="16" fill="#310790"/>
  <g clip-path="url(#c)">
    <rect width="440" height="230" fill="url(#b)"/>
    <rect class="g" width="440" height="230" fill="url(#r)"/>
    <rect width="440" height="4" fill="#8B5CF6"/>
    <rect class="sw" x="0" y="0" width="180" height="230" fill="url(#swg)" transform="skewX(-20)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="229" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <g transform="translate(26 22)"><g class="if"><g class="fp">
    <rect x="0" y="6" width="48" height="48" rx="12" fill="#2c0780"/>
    <rect x="0" y="3" width="48" height="48" rx="12" fill="#470bd0"/>
    <rect width="48" height="48" rx="12" fill="#1c2233"/>
    <rect width="48" height="48" rx="12" fill="#8B5CF6" fill-opacity=".16"/>
    <text x="24" y="32" text-anchor="middle" font-size="23">🎓</text>
    <rect width="48" height="48" rx="12" fill="url(#gl)"/>
    <rect x=".5" y=".5" width="47" height="47" rx="11.5" fill="none" stroke="#8B5CF6" stroke-opacity=".6"/>
  </g></g></g>
  <text x="88" y="46" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f4f7fb">Moti-Graph Academy</text>
